name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python tests and validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python - <<'PY'
          import ast
          import pathlib
          import sys

          errors = []
          for path in pathlib.Path("api").rglob("*.py"):
              try:
                  ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              except SyntaxError as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              print("Python syntax errors:")
              print("\n".join(errors))
              sys.exit(1)
          print("All Python files syntax OK")
          PY

      - name: Validate ML, metrics and encryption
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "api")

          from ml.logistic import (
              generate_synthetic_dataset,
              min_max_normalize,
              stratified_split,
              to_xy,
              accuracy,
          )
          from ml.algorithms import train_central, train_fedavg
          from ml.metrics import confusion_matrix, roc_curve
          from core.encryption import encrypt_json, decrypt_json, model_passphrase

          ds = generate_synthetic_dataset(500, 4, 42)
          features = [c for c in ds["cols"] if c != ds["label_col"]]
          normalized, _ = min_max_normalize(ds["rows"], features)
          train, val, test = stratified_split(normalized, ds["label_col"], seed=99)

          X, y = to_xy(train, features, ds["label_col"])
          val_X, val_y = to_xy(val, features, ds["label_col"])
          test_X, test_y = to_xy(test, features, ds["label_col"])

          central = train_central(X, y, val_X, val_y, rounds=40, lr=0.6)
          central_acc = accuracy(central["weights"], val_X, val_y)
          assert central_acc > 0.60, f"Central accuracy {central_acc:.2f} < 0.60"

          clients = []
          for i in range(3):
              rows = [row for j, row in enumerate(train) if j % 3 == i]
              cX, cy = to_xy(rows, features, ds["label_col"])
              clients.append({"X": cX, "y": cy})

          fedavg = train_fedavg(clients, val_X, val_y, rounds=10, local_epochs=2, lr=0.4)
          fedavg_acc = accuracy(fedavg["weights"], val_X, val_y)
          assert fedavg_acc > 0.55, f"FedAvg accuracy {fedavg_acc:.2f} < 0.55"

          ciphertext, iv = encrypt_json({"test": 42}, "ci-key")
          assert decrypt_json(ciphertext, iv, "ci-key")["test"] == 42

          cm = confusion_matrix(central["weights"], test_X, test_y)
          assert sum(cm.values()) == len(test_X)

          roc = roc_curve(central["weights"], test_X, test_y)
          assert roc["auc"] > 0.55, f"AUC {roc['auc']:.3f} <= 0.55"

          assert model_passphrase("u1", "e1") != model_passphrase("u2", "e1")
          print(
              f"Validation PASS — Central {central_acc*100:.1f}%, "
              f"FedAvg {fedavg_acc*100:.1f}%, AUC {roc['auc']:.3f}"
          )
          PY

  frontend:
    name: React build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit | grep -q .
          find dist/assets -maxdepth 1 -type f -name '*.css' -print -quit | grep -q .
          echo "Frontend build output OK"
